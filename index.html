<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas PRO v4.1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121824; color: #ffffff; padding: 15px; }
    
    /* Header Patrimonio */
    .header-card { background: #0b111e; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 15px; }
    .header-card h2 { font-size: 11px; text-transform: uppercase; color: #8899a6; letter-spacing: 1px; }
    .header-card .total { font-size: 26px; font-weight: bold; color: #38ef7d; margin: 5px 0; }

    /* Navegación por Pestañas */
    .nav-tabs { display: flex; border-bottom: 2px solid #1f293d; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #8899a6; font-size: 14px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { color: #ffffff; border-bottom: 3px solid #00c6ff; }

    /* Formularios y Tarjetas */
    .card { background: #1a2332; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .card h3 { font-size: 15px; margin-bottom: 12px; color: #e1e8ed; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #8899a6; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #2c3e50; background: #0f172a; color: #fff; font-size: 14px; }
    
    .btn-submit { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-submit:active { background: #059669; }

    /* Lista del Historial */
    .item-movimiento { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #273549; font-size: 13px; }
    .ingreso { color: #38ef7d; }
    .egreso { color: #ff4e50; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- Cabecera -->
  <div class="header-card">
    <h2>Patrimonio Total Estimado</h2>
    <div class="total" id="patrimonioTotal">$0.00</div>
  </div>

  <!-- Pestañas de Navegación -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="cambiarPestaña('flujo')">Flujo</button>
    <button class="tab-btn" onclick="cambiarPestaña('divisas')">Cuentas</button>
  </div>

  <!-- Vista 1: Flujo (Registrar Movimiento) -->
  <div id="vista-flujo" class="tab-content active">
    <div class="card">
      <h3>Registrar Movimiento</h3>
      
      <div class="form-group">
        <label>Tipo de Operación</label>
        <select id="tipo" class="form-control">
          <option value="ingreso">Ingreso (+)</option>
          <option value="egreso">Egreso (-)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Cuenta / Método de Pago</label>
        <select id="cuenta" class="form-control">
          <option value="efectivo_usd">Efectivo (USD $)</option>
          <option value="efectivo_bs">Efectivo (Bs.)</option>
          <option value="binance">Binance (USDT)</option>
          <option value="bdv">Banco de Venezuela (BDV)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Monto</label>
        <input type="number" id="monto" class="form-control" placeholder="0.00" step="0.01">
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <input type="text" id="descripcion" class="form-control" placeholder="Ej. Trabajo, Mercado, Servicios...">
      </div>

      <button class="btn-submit" onclick="guardarMovimiento()">Guardar Movimiento</button>
    </div>

    <div class="card">
      <h3>Historial de Movimientos</h3>
      <div id="listaHistorial">
        <p style="color: #8899a6; font-size: 12px; text-align: center;">No hay movimientos registrados</p>
      </div>
    </div>
  </div>

  <!-- Vista 2: Estado de Cuentas -->
  <div id="vista-divisas" class="tab-content">
    <div class="card">
      <h3>Saldos Actuales por Cuenta</h3>
      <div class="form-group">
        <label>Efectivo (USD $)</label>
        <input type="text" id="saldo-efectivo_usd" class="form-control" value="$0.00" readonly>
      </div>
      <div class="form-group">
        <label>Efectivo (Bs.)</label>
        <input type="text" id="saldo-efectivo_bs" class="form-control" value="Bs. 0.00" readonly>
      </div>
      <div class="form-group">
        <label>Binance (USDT)</label>
        <input type="text" id="saldo-binance" class="form-control" value="0.00 USDT" readonly>
      </div>
      <div class="form-group">
        <label>Banco de Venezuela (BDV)</label>
        <input type="text" id="saldo-bdv" class="form-control" value="Bs. 0.00" readonly>
      </div>
    </div>
  </div>

  <script>
    // Cargar o inicializar datos
    let saldos = JSON.parse(localStorage.getItem('saldos')) || {
      efectivo_usd: 0,
      efectivo_bs: 0,
      binance: 0,
      bdv: 0
    };

    let historial = JSON.parse(localStorage.getItem('historial')) || [];

    // Cambiar de Pestaña
    function cambiarPestaña(pestana) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(view => view.classList.remove('active'));
      
      if(pestana === 'flujo') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('vista-flujo').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('vista-divisas').classList.add('active');
      }
    }

    // Guardar Operación
    function guardarMovimiento() {
      const tipo = document.getElementById('tipo').value;
      const cuenta = document.getElementById('cuenta').value;
      const monto = parseFloat(document.getElementById('monto').value);
      const descripcion = document.getElementById('descripcion').value || 'Sin descripción';

      if (isNaN(monto) || monto <= 0) {
        alert("Por favor ingresa un monto válido.");
        return;
      }

      // Actualizar Saldo
      if (tipo === 'ingreso') {
        saldos[cuenta] += monto;
      } else {
        saldos[cuenta] -= monto;
      }

      // Guardar en Historial
      historial.unshift({
        tipo,
        cuenta,
        monto,
        descripcion,
        fecha: new Date().toLocaleDateString()
      });

      // Guardar en almacenamiento del navegador
      localStorage.setItem('saldos', JSON.stringify(saldos));
      localStorage.setItem('historial', JSON.stringify(historial));

      // Limpiar campos y actualizar interfaz
      document.getElementById('monto').value = '';
      document.getElementById('descripcion').value = '';
      actualizarInterfaz();
    }

    // Actualizar Vistas y Totales
    function actualizarInterfaz() {
      // Mostrar Saldos por Cuenta
      document.getElementById('saldo-efectivo_usd').value = `$${saldos.efectivo_usd.toFixed(2)}`;
      document.getElementById('saldo-efectivo_bs').value = `Bs. ${saldos.efectivo_bs.toFixed(2)}`;
      document.getElementById('saldo-binance').value = `${saldos.binance.toFixed(2)} USDT`;
      document.getElementById('saldo-bdv').value = `Bs. ${saldos.bdv.toFixed(2)}`;

      // Calcular Patrimonio Total en USD
      const totalUSD = saldos.efectivo_usd + saldos.binance;
      document.getElementById('patrimonioTotal').innerText = `$${totalUSD.toFixed(2)}`;

      // Renderizar Historial
      const contenedor = document.getElementById('listaHistorial');
      if (historial.length === 0) {
        contenedor.innerHTML = '<p style="color: #8899a6; font-size: 12px; text-align: center;">No hay movimientos registrados</p>';
        return;
      }

      contenedor.innerHTML = '';
      historial.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-movimiento';
        const signo = item.tipo === 'ingreso' ? '+' : '-';
        const claseColor = item.tipo === 'ingreso' ? 'ingreso' : 'egreso';
        
        div.innerHTML = `
          <div>
            <strong>${item.descripcion}</strong><br>
            <small style="color: #8899a6;">${item.cuenta.toUpperCase()} • ${item.fecha}</small>
          </div>
          <div class="${claseColor}">
            ${signo}${item.monto.toFixed(2)}
          </div>
        `;
        contenedor.appendChild(div);
      });
    }

    // Inicializar al cargar la página
    actualizarInterfaz();
  </script>
</body>
</html>
